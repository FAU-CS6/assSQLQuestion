services:
    ilias:
        image: srsolutions/ilias:11
        ports:
          - 127.0.0.1:8080:80
        depends_on:
          mysql:
            condition: service_healthy
        environment:
          - ILIAS_DUMP_AUTOLOAD=1
          - ILIAS_AUTO_SETUP=1
          - ILIAS_AUTO_UPDATE=0
          - ILIAS_DB_USER=root
          - ILIAS_DB_PASSWORD=example
          - ILIAS_HTTP_PATH=http://localhost:8080
        volumes:
          - .:/var/www/html/public/Customizing/global/plugins/Modules/TestQuestionPool/Questions/assSQLQuestion:ro
    mysql:
        image: mariadb:10.11
        # ILIAS does not support UTF8MB4 (yet), see https://docu.ilias.de/ilias.php?baseClass=illmpresentationgui&cmd=resume&ref_id=367
        command: |
            --character-set-server=utf8
            --collation-server=utf8_general_ci
            --max-allowed-packet=32M
        environment:
          - MYSQL_ROOT_PASSWORD=example
          - MYSQL_DATABASE=ilias
        healthcheck:
          test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
          interval: 5s
          timeout: 5s
          retries: 30
