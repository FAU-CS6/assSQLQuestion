<script>
(function () {
  /* Here, we regularly check for elements that only exist after CodeMirror is done loading */
  function hide(elem) {
    elem.style.display = 'none';
  }
  var callbackTimer = setInterval(function() {
    var exists = false;
    try {
      exists = document.getElementsByClassName('cm-gutters');
    } catch (e) {}

    if (exists.length > 0) {
      clearInterval(callbackTimer);
      Array.from(document.getElementsByClassName('js-is-loading')).forEach(hide);
    }
  }, 100);
})();
</script>
