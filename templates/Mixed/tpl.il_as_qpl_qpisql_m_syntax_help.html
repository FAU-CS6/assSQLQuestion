<div class="qpisql-info-area help-block">
  <b onclick="$('#qpisql-syntax-help-text').slideToggle(500, function() {$('#qpisql-syntax-help-chevron').toggleClass(['glyphicon-chevron-up', 'glyphicon-chevron-down'])})">
    <span id="qpisql-syntax-help-chevron" aria-hidden="true" class="glyphicon glyphicon-chevron-down"></span>
    {TITLE}
  </b>
  <div id="qpisql-syntax-help-text" style="display: none;">
    <p>{TEXT}</p>
  </div>
</div>
