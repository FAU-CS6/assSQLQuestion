<div class="qpisql-input-area qpisql-execution-controls">
  <button type="button" class="btn-default btn-sm btn" id="qpisql-execute-button" onclick="window.EXECUTE_HANDLER.execute()" aria-keyshortcuts="Control+Enter Meta+Enter">{BUTTONTEXT}</button>
  <button type="button" class="btn-default btn-sm btn" id="qpisql-cancel-button" onclick="window.EXECUTE_HANDLER.cancel()" data-cancelled="{CANCELLED}" hidden>{CANCELTEXT}</button>
  <span class="help-block qpisql-shortcut">{SHORTCUT}</span>
  <script>
    window.EXECUTE_HANDLER.registerOutput(new ExecuteButtonOutput());
  </script>
</div>
