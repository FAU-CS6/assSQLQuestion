<div class="qpisql-hidden-fields">
  <input type="hidden" name="error_bool" id="qpisql-error-bool" value="{ERROR_BOOL}" />
  <input type="hidden" name="error" id="qpisql-error" value="{ERROR}" />
  <input type="hidden" name="executed_bool" id="qpisql-executed-bool" value="{EXECUTED_BOOL}" />
  <input type="hidden" name="output_relation" id="qpisql-output-relation" value="{OUTPUT_RELATION}" />
</div>
<div id="qpisql-output-area" class="qpisql-output-area" data-labels="{LABELS}">
  <div class="qpisql-answer-status">
    <span id="qpisql-execution-status" role="status" aria-live="polite"></span>
    <span id="qpisql-save-status" role="status" aria-live="polite">{STATUS_LOADED}</span>
  </div>
  <div id="qpisql-output-area-error" class="qpisql-inner-output-area qpisql-output-area-error" style="display:none"></div>
  <div id="qpisql-output-area-execution-running" class="qpisql-inner-output-area qpisql-output-area-execution-running" style="display:none">{STATUS_EXECUTION_RUNNING}</div>
  <div id="qpisql-output-area-relation" class="qpisql-inner-output-area qpisql-output-area-relation" style="display:none"></div>
</div>
<script>
  var outputAreaOutput = new OutputAreaOutput();
  // Keep the existing error-class API available to integrations.
  var error_no_execution = outputAreaOutput.labels.notExecuted;
  var error_db_creation = outputAreaOutput.labels.dbCreation;
  var error_integrity_check = outputAreaOutput.labels.integrity;
  var error_no_visible_result = outputAreaOutput.labels.noVisibleResult;
  var error_running_sequence = outputAreaOutput.labels.sequenceError;
  outputAreaOutput.restore(
    document.getElementById('qpisql-error-bool').value,
    document.getElementById('qpisql-error').value,
    document.getElementById('qpisql-executed-bool').value,
    document.getElementById('qpisql-output-relation').value
  );
  window.EXECUTE_HANDLER.registerOutput(outputAreaOutput);
</script>
