name: Editor, QSS and dependency checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  editor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lib/codemirror
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: lib/codemirror/.nvmrc
          cache: npm
          cache-dependency-path: lib/codemirror/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run audit:security
      - run: npm run build:check
      - name: Test functional dependency equivalence
        working-directory: .
        run: node tests/browser/functional-dependencies.cjs
      - name: Test shipped editor and SQL UI regressions
        working-directory: .
        run: >-
          docker run --rm -v "$PWD:/plugin:ro" -w /tmp/editor-browser
          -e NODE_PATH=/tmp/editor-browser/node_modules
          mcr.microsoft.com/playwright:v1.56.1-noble
          sh -c 'cp /plugin/tests/browser/package.json /plugin/tests/browser/package-lock.json . &&
          npm ci --ignore-scripts --no-audit --no-fund &&
          node /plugin/tests/browser/editor-assistance.cjs &&
          node /plugin/tests/browser/qol.cjs'
      - name: Audit browser test dependencies
        working-directory: tests/browser
        run: npm audit --package-lock-only
  qss:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lib/qss
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: lib/codemirror/.nvmrc
          cache: npm
          cache-dependency-path: lib/qss/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Install browser test dependencies
        working-directory: tests/browser
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Ensure headless Google Chrome is available
        working-directory: tests/browser
        run: npx playwright install --with-deps chrome
      - run: npm test
      - run: npm run build:check
      - run: npm audit --audit-level=low
      - name: Test question-local assessment barrier and worker lifecycle
        working-directory: .
        run: |
          node tests/browser/qss-ui.cjs
          node tests/browser/qss-incomplete-results.cjs
          node tests/browser/test-form-token.cjs
  php-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Audit plugin dependencies
        run: docker run --rm -v "$PWD:/app:ro" -w /app composer:2 audit --locked --no-interaction
      - name: Audit bundled PHP minifier dependencies
        run: docker run --rm -v "$PWD:/app:ro" -w /app/lib/minify composer:2 audit --locked --no-interaction
