version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: composer
    directory: /lib/minify
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /lib/codemirror
    schedule:
      interval: weekly
    groups:
      editor-build:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /tests/browser
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
